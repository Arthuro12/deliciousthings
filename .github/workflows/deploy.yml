name: Build and Deploy changes

on: 
  push:
    branches:
      - main
      - dev

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
        node-version: "25.0.0"
        cache: "npm"
      
      - name: Install Composer deps
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build frontend (Vite)
        run: |
          npm ci
          npm run build

      - uses: webfactory/ssh-agent@v0.9.0
        with: { ssh-private-key: ${{ secrets.SSH_KEY }} }
        - run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
        - run: |
          rsync -az --delete \
          --exclude=".git" --exclude=".github" --exclude=".env" --exclude="storage/**" \
          ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.STAGING_DEPLOY_PATH }}/
        - run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd '${{ secrets.STAGING_DEPLOY_PATH }}' && \
          php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache"